name: CWS Advanced Stats Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data results

      - name: Scrape NCAA team stats
        run: python scrape_ncaa_stats.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run analysis
        run: python analyze_cws_stats.py

      - name: Generate visualizations
        run: python visualize_results.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ results/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update CWS analysis"
          git push || echo "Nothing to push"
